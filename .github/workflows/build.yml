name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $v = python -c "import taskpatrol; print(taskpatrol.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build exe and installer
        run: python packaging/build.py

      - name: Smoke test portable exe (workers run, window stays responsive)
        shell: pwsh
        run: |
          $exe = "dist\TaskPatrol-${{ steps.meta.outputs.version }}.exe"
          $report = "$env:RUNNER_TEMP\smoke.txt"
          $p = Start-Process $exe -ArgumentList "--smoke-test", $report -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "exe did not exit" }
          if (Test-Path $report) { Get-Content $report } else { throw "no smoke report written" }
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          $left = Get-Process -Name "TaskPatrol-*" -ErrorAction SilentlyContinue
          if ($left) { $left | Format-Table Id, ProcessName; throw "worker processes left running" }

      - name: Test silent install and uninstall
        shell: pwsh
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          $setup = Start-Process "dist\TaskPatrol-$v-Setup.exe" -ArgumentList "/VERYSILENT","/CURRENTUSER","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "setup exited with $($setup.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\TaskPatrol\$v"
          if (-not (Test-Path "$dir\TaskPatrol-$v.exe")) { throw "exe not installed to $dir" }
          $un = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $un.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Write-Host "Installed and uninstalled $v from $dir"

      - uses: actions/upload-artifact@v4
        with:
          name: TaskPatrol-${{ steps.meta.outputs.version }}-windows
          path: |
            dist/TaskPatrol-*.exe

      - name: Publish exe to downloads/ (once per version)
        if: github.event_name == 'push' && github.ref_type == 'branch'
        shell: pwsh
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          if (Test-Path "downloads/TaskPatrol-$v.exe") { Write-Host "TaskPatrol $v already in downloads/"; exit 0 }
          New-Item -ItemType Directory -Force downloads | Out-Null
          Copy-Item "dist/TaskPatrol-$v.exe", "dist/TaskPatrol-$v-Setup.exe" downloads/
          git config user.name "github-actions[bot]"
          git config user.email "41898585+github-actions[bot]@users.noreply.github.com"
          git add downloads
          git commit -m "Publish TaskPatrol $v Windows build [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TaskPatrol-*.exe
